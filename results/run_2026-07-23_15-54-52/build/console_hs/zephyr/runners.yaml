# Available runners configured by board.cmake.
runners:
- mplab_ipe
- jlink

# Default flash runner if --runner is not given.
flash-runner: mplab_ipe

# Default debug runner if --runner is not given.
debug-runner: jlink

# Common runner configuration values.
config:
  board_dir: D:/ZephyrProject/mchp_zephyrproject/zephyr/boards/microchip/pic32c/pic32ck_sg01_cult
  # Build outputs:
  elf_file: zephyr.elf
  hex_file: zephyr.hex
  bin_file: zephyr.bin
  # Host tools:
  gdb: C:/Users/I73904/zephyr-sdk-1.0.1/gnu/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb.exe
  openocd: C:/Users/I73904/zephyr-sdk-1.0.1/hosttools/openocd/bin/openocd.exe
  openocd_search:
    - C:/Users/I73904/zephyr-sdk-1.0.1/hosttools/openocd/share/openocd/scripts

# Runner specific arguments
args:
  mplab_ipe:
    - --tool
    - PKOB4
    - --part
    - 32CK2051SG01144
    - --erase
    - --verify
  jlink:
    - --dt-flash=y
    - --device=PIC32CK2051SG
    - --speed=4000
